<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACT Math Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e4; --paper-line: rgba(58,74,94,0.14); --paper-line-strong: rgba(58,74,94,0.26);
    --ink: #26313f; --ink-soft: #5b6b7d; --card-bg: #fffdf7; --card-border: #ddd2b6;
    --accent: #2f7d6b; --accent-strong: #1f5c4e; --accent-soft: rgba(47,125,107,0.12); --accent-ink: #f5fbf9;
    --good: #3f7a52; --good-soft: rgba(63,122,82,0.14); --bad: #b3413a; --bad-soft: rgba(179,65,58,0.12);
    --warn: #a86a12; --warn-soft: rgba(168,106,18,0.15); --shadow: rgba(38,49,63,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b2330; --paper-line: rgba(238,242,240,0.07); --paper-line-strong: rgba(238,242,240,0.15);
      --ink: #edf1ef; --ink-soft: #a3aebb; --card-bg: #232e3d; --card-border: #3a4a61;
      --accent: #5fd1b3; --accent-strong: #86e0c8; --accent-soft: rgba(95,209,179,0.16); --accent-ink: #0c2620;
      --good: #7bc794; --good-soft: rgba(123,199,148,0.16); --bad: #ff9a90; --bad-soft: rgba(255,154,144,0.14);
      --warn: #f0b95a; --warn-soft: rgba(240,185,90,0.16); --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b2330; --paper-line: rgba(238,242,240,0.07); --paper-line-strong: rgba(238,242,240,0.15);
    --ink: #edf1ef; --ink-soft: #a3aebb; --card-bg: #232e3d; --card-border: #3a4a61;
    --accent: #5fd1b3; --accent-strong: #86e0c8; --accent-soft: rgba(95,209,179,0.16); --accent-ink: #0c2620;
    --good: #7bc794; --good-soft: rgba(123,199,148,0.16); --bad: #ff9a90; --bad-soft: rgba(255,154,144,0.14);
    --warn: #f0b95a; --warn-soft: rgba(240,185,90,0.16); --shadow: rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: repeating-linear-gradient(0deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 32px),
                repeating-linear-gradient(90deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 32px), var(--paper);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    padding: clamp(16px, 3vw, 40px) 16px 80px;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  .wrap { max-width: 1040px; margin: 0 auto; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.9rem, 5vw, 2.6rem); margin: 6px 0 10px; text-wrap: balance; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0 0 8px; }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: 0 14px 32px -22px var(--shadow), 0 2px 8px -2px var(--shadow); padding: clamp(16px, 3vw, 28px); }
  .btn { border: none; border-radius: 10px; padding: 11px 22px; font-size: 0.95rem; font-weight: 700; transition: transform 0.1s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 16px -8px var(--accent-strong); }
  .btn-secondary { background: transparent; border: 1.5px solid var(--card-border); color: var(--ink); padding: 9.5px 18px; }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* start screen */
  .start { max-width: 720px; margin: 6vh auto 0; text-align: center; }
  .start p { color: var(--ink-soft); line-height: 1.6; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 22px 0; }
  .fact { border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 8px; background: var(--paper); }
  .fact b { display: block; font-family: "JetBrains Mono", monospace; font-size: 1.5rem; color: var(--accent-strong); }
  .fact span { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .opt { display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 20px; font-weight: 600; cursor: pointer; }
  .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  .rules { text-align: left; font-size: 0.92rem; color: var(--ink-soft); line-height: 1.6; margin: 0 auto 18px; max-width: 520px; padding-left: 20px; }

  /* exam layout */
  .topbar { position: sticky; top: 10px; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; margin-bottom: 18px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; box-shadow: 0 10px 26px -16px var(--shadow); }
  .timer { font-family: "JetBrains Mono", monospace; font-size: 1.4rem; font-weight: 700; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--warn); }
  .timer.crit { color: var(--bad); }
  .timer small { font-family: "Source Sans 3", sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-left: 6px; }
  .progress { font-size: 0.9rem; color: var(--ink-soft); font-weight: 600; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .navcard { position: static !important; order: 2; } .grid { grid-template-columns: repeat(9, 1fr) !important; } }

  .qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .qnum { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.35rem; }
  .flagbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1.5px solid var(--card-border); color: var(--ink-soft); padding: 7px 13px; border-radius: 9px; font-size: 0.84rem; font-weight: 700; }
  .flagbtn.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .flagbtn svg { width: 14px; height: 14px; }
  .qbody { font-size: 1.04rem; line-height: 1.7; margin-bottom: 16px; }
  .qbody .math, .opts .math { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.98rem; }
  .eqs { text-align: center; margin: 10px 0 12px; line-height: 2; }
  .note { font-size: 0.82rem; color: var(--ink-soft); font-style: italic; margin: 4px 0 8px; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; line-height: 1.15; }
  .frac .num { border-bottom: 1.3px solid currentColor; padding: 0 3px 1px; }
  .frac .den { padding: 1px 3px 0; }
  .dtable { border-collapse: collapse; margin: 10px auto 12px; font-family: "JetBrains Mono", monospace; font-size: 0.86rem; }
  .dtable th, .dtable td { border: 1px solid var(--card-border); padding: 6px 12px; text-align: center; }
  .dtable th { background: var(--paper-line); }

  .figwrap { display: flex; justify-content: center; margin: 6px 0 14px; }
  svg.fig { width: 100%; max-width: 300px; height: auto; overflow: visible; }
  svg.fig.plane { max-width: 270px; }
  .fig text { fill: var(--ink); stroke: none; font-family: "Source Sans 3", sans-serif; font-size: 13px; }
  .fig text.sm { font-size: 12px; } .fig text.tick { font-size: 9px; fill: var(--ink-soft); } .fig text.pt { font-weight: 700; font-size: 12.5px; }
  .fig line, .fig polygon, .fig polyline, .fig path, .fig circle, .fig ellipse { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
  .fig .thin { stroke-width: 1.1; } .fig .dash { stroke-dasharray: 4 3; stroke-width: 1.2; }
  .fig .shade { fill: var(--accent-soft); stroke: var(--ink); }
  .fig .dot { fill: var(--accent-strong); stroke: none; }
  .fig .grid { stroke: var(--paper-line-strong); stroke-width: 0.6; } .fig .axis { stroke-width: 1.4; }
  .fig .curve { stroke: var(--accent-strong); stroke-width: 2.4; }

  .opts { display: grid; gap: 9px; margin-bottom: 18px; }
  .opt-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: 11px; padding: 10px 14px; font-size: 1rem; color: var(--ink); transition: border-color 0.12s ease, background 0.12s ease; }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
  .opt-btn .let { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--card-border); display: grid; place-items: center; font-weight: 700; font-size: 0.86rem; }
  .opt-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt-btn.sel .let { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt-btn.right { border-color: var(--good); background: var(--good-soft); }
  .opt-btn.right .let { background: var(--good); border-color: var(--good); color: var(--card-bg); }
  .opt-btn.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt-btn.wrong .let { background: var(--bad); border-color: var(--bad); color: var(--card-bg); }
  .navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .navcard { position: sticky; top: 84px; padding: 16px; }
  .navcard h3 { margin: 0 0 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nb { position: relative; aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--card-border); background: transparent; color: var(--ink); font-weight: 700; font-size: 0.82rem; font-family: "JetBrains Mono", monospace; padding: 0; }
  .nb.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .nb.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .nb.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 1.5px solid var(--card-bg); }
  .legend { margin-top: 12px; font-size: 0.76rem; color: var(--ink-soft); display: grid; gap: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1.5px solid var(--card-border); }
  .submit-row { margin-top: 14px; }
  .submit-row .btn { width: 100%; }

  /* results */
  .scorehead { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .bigscore { font-family: "JetBrains Mono", monospace; font-size: clamp(2.6rem, 8vw, 3.8rem); font-weight: 700; color: var(--accent-strong); line-height: 1; }
  .bigscore small { font-size: 0.4em; color: var(--ink-soft); }
  .meta { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.7; }
  .topics { margin: 22px 0 6px; display: grid; gap: 10px; }
  .trow { display: grid; grid-template-columns: 190px 1fr 70px; gap: 12px; align-items: center; font-size: 0.92rem; }
  @media (max-width: 560px) { .trow { grid-template-columns: 1fr 70px; } .trow .bar { grid-column: 1 / -1; order: 3; } }
  .bar { height: 12px; background: var(--paper-line); border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
  .trow b { font-family: "JetBrains Mono", monospace; text-align: right; font-size: 0.88rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 14px; }
  .chip { border: 1.5px solid var(--card-border); background: transparent; color: var(--ink); border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 0.84rem; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .review { margin-bottom: 16px; }
  .rv-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
  .tag.ok { background: var(--good-soft); color: var(--good); } .tag.no { background: var(--bad-soft); color: var(--bad); } .tag.skip { background: var(--warn-soft); color: var(--warn); }
  .tag.topic { background: var(--paper-line); color: var(--ink-soft); } .tag.flag { background: var(--warn-soft); color: var(--warn); }
  .rv-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .expl { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: 0.93rem; line-height: 1.65; margin-top: 4px; }
  .expl b { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-strong); display: block; margin-bottom: 4px; }
  .rv-opts .opt-btn { cursor: default; padding: 8px 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
// ============================================================
// Core helpers: random utilities, number formatting, choice builder, SVG figures
// ============================================================
function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function rnz(a, b) { var v; do { v = ri(a, b); } while (v === 0); return v; }
function pick(arr) { return arr[ri(0, arr.length - 1)]; }
function shuf(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = ri(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function round2(x) { return Math.round(x * 100) / 100; }

// format a number for display (unicode minus via entity, <=2 decimals, optional commas)
function fmt(x, commas) {
  if (Math.abs(x - Math.round(x)) < 1e-9) x = Math.round(x); else x = round2(x);
  var neg = x < 0, s = String(Math.abs(x));
  if (commas) { var parts = s.split("."); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); s = parts.join("."); }
  return (neg ? "&minus;" : "") + s;
}
function money(x) {
  var neg = x < 0; x = Math.abs(x);
  var s = (Math.round(x * 100) / 100).toFixed(Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 2);
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "&minus;" : "") + "$" + s;
}
function frac(n, d) { return "<span class=\"frac\"><span class=\"num\">" + n + "</span><span class=\"den\">" + d + "</span></span>"; }
// reduced fraction html from integers (integer if denominator 1)
function fr(p, q) {
  var g = gcd(p, q); p /= g; q /= g; if (q < 0) { p = -p; q = -q; }
  if (q === 1) return fmt(p);
  return (p < 0 ? "&minus;" : "") + frac(Math.abs(p), q);
}
function sup(s) { return "<sup>" + s + "</sup>"; }
// signed coefficient term helpers:  "+ 3x", "- x", "+ 5"
function term(c, v) { if (c === 0) return ""; var a = Math.abs(c); var s = (a === 1 && v) ? "" : String(a); return (c < 0 ? " &minus; " : " + ") + s + (v || ""); }
function lead(c, v) { if (c === 0) return "0"; var a = Math.abs(c); var s = (a === 1 && v) ? "" : String(a); return (c < 0 ? "&minus;" : "") + s + (v || ""); }
// polynomial a x^2 + b x + c as html
function quad(a, b, c) { return lead(a, "x" + sup(2)) + term(b, "x") + term(c, ""); }
function lin(m, b) { return lead(m, "x") + term(b, ""); }
function mx(s) { return "<span class=\"math\">" + s + "</span>"; }

// choice items: {v: numeric value or null, s: display html}
function I(v, s) { return { v: v, s: s, num: false }; }
function N(v, f) { var it = { v: v, s: (f || fmt)(v), num: true }; return it; }
function T(s, v) { return { v: v === undefined ? null : v, s: s, num: false }; }

// build a question: topic, prompt html, correct item, wrong items, explanation html
function mk(topic, html, correct, wrongs, expl, opts) {
  opts = opts || {};
  var items = [correct], seen = {}; seen[correct.s] = true;
  wrongs.forEach(function (w) { if (w && !seen[w.s] && (w.v === null || isFinite(w.v))) { seen[w.s] = true; items.push(w); } });
  (opts.more || []).forEach(function (w) { if (items.length < 4 && w && !seen[w.s]) { seen[w.s] = true; items.push(w); } });
  // pad numeric questions with neighbours if short
  if (correct.num && items.length < 4) {
    var f = opts.fmt || fmt;
    var offs = [1, -1, 2, -2, 3, -3, 5, -5, 10, -10, 0.5, -0.5];
    for (var i = 0; i < offs.length && items.length < 4; i++) {
      var nv = correct.v + offs[i] * (opts.step || 1);
      var it = N(nv, f);
      if (!seen[it.s]) { seen[it.s] = true; items.push(it); }
    }
  }
  items = items.slice(0, 4);
  var correctRef = correct;
  var allNum = items.every(function (x) { return x.v !== null && x.v !== undefined; });
  if (allNum) items.sort(function (a, b) { return a.v - b.v; });
  else items = shuf(items);
  return { topic: topic, html: html, choices: items.map(function (x) { return x.s; }), answer: items.indexOf(correctRef), expl: expl };
}

// ---------------- SVG figures ----------------
function svgWrap(w, h, inner, cls) {
  return "<div class=\"figwrap\"><svg class=\"fig " + (cls || "") + "\" viewBox=\"0 0 " + w + " " + h + "\" role=\"img\" aria-label=\"figure\">" + inner + "</svg></div>";
}
function sText(x, y, s, anchor, cls) { return "<text x=\"" + x + "\" y=\"" + y + "\" text-anchor=\"" + (anchor || "middle") + "\"" + (cls ? " class=\"" + cls + "\"" : "") + ">" + s + "</text>"; }
function sLine(x1, y1, x2, y2, cls) { return "<line x1=\"" + x1 + "\" y1=\"" + y1 + "\" x2=\"" + x2 + "\" y2=\"" + y2 + "\"" + (cls ? " class=\"" + cls + "\"" : "") + "/>"; }
function sPoly(pts, cls) { return "<polygon points=\"" + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + "\"" + (cls ? " class=\"" + cls + "\"" : "") + "/>"; }
function rightMark(x, y, dx, dy, s) { // square at corner (x,y); dx,dy = +/-1 directions into the triangle
  s = s || 9; return "<polyline class=\"thin\" points=\"" + (x + dx * s) + "," + y + " " + (x + dx * s) + "," + (y + dy * s) + " " + x + "," + (y + dy * s) + "\"/>";
}

// Right triangle, right angle at bottom-left. labels: bottom, left, hyp (html strings, may be "")
function svgRightTri(a, b, lb) {
  var W = 240, H = 170, pad = 28;
  var ratio = Math.max(0.55, Math.min(1.9, a / b));
  var h = 110, w = Math.min(190, Math.max(70, h * ratio));
  var x0 = pad + 18, y0 = H - pad;
  var B = [x0 + w, y0], C = [x0, y0 - h];
  var inner = sPoly([[x0, y0], B, C], "shape") + rightMark(x0, y0, 1, -1) +
    sText(x0 + w / 2, y0 + 17, lb.bottom || "") + sText(x0 - 8, y0 - h / 2 + 4, lb.left || "", "end") +
    sText((x0 + B[0]) / 2 + 14, y0 - h / 2 - 6, lb.hyp || "", "start");
  if (lb.angle) inner += sText(B[0] - 34, y0 - 6, lb.angle, "middle", "sm");
  if (lb.topAngle) inner += sText(x0 + 8, C[1] + 26, lb.topAngle, "start", "sm");
  return svgWrap(W, H, inner);
}
// Triangle ABC with DE parallel to BC; labels on segments
function svgSimilar(lb) {
  var W = 250, H = 170;
  var A = [125, 14], B = [24, 148], C = [226, 148], t = 0.5;
  var D = [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])];
  var E = [A[0] + t * (C[0] - A[0]), A[1] + t * (C[1] - A[1])];
  var inner = sPoly([A, B, C], "shape") + sLine(D[0], D[1], E[0], E[1]) +
    sText(A[0], A[1] - 3, "A", "middle", "pt") + sText(B[0] - 8, B[1] + 4, "B", "end", "pt") + sText(C[0] + 8, C[1] + 4, "C", "start", "pt") +
    sText(D[0] - 8, D[1] + 4, "D", "end", "pt") + sText(E[0] + 8, E[1] + 4, "E", "start", "pt") +

    app.innerHTML = html;
    document.getElementById("newBtn").addEventListener("click", renderStart);
    renderReview();
  }

  function renderReview() {
    var counts = { all: S.qs.length, missed: 0, flagged: 0, skipped: 0 };
    S.qs.forEach(function (q, i) { if (S.ans[i] !== q.answer) counts.missed++; if (S.flags[i]) counts.flagged++; if (S.ans[i] < 0) counts.skipped++; });
    var defs = [["all", "All questions"], ["missed", "Missed or skipped"], ["flagged", "Flagged"], ["skipped", "Unanswered"]];
    var f = document.getElementById("filters");
    f.innerHTML = defs.map(function (d) { return "<button class=\"chip" + (reviewFilter === d[0] ? " on" : "") + "\" data-f=\"" + d[0] + "\" type=\"button\">" + d[1] + " (" + counts[d[0]] + ")</button>"; }).join("");
    f.querySelectorAll(".chip").forEach(function (b) { b.addEventListener("click", function () { reviewFilter = b.getAttribute("data-f"); renderReview(); }); });
    var list = document.getElementById("reviewList"), out = "";
    S.qs.forEach(function (q, i) {
      var ua = S.ans[i], ok = ua === q.answer;
      if (reviewFilter === "missed" && ok) return;
      if (reviewFilter === "flagged" && !S.flags[i]) return;
      if (reviewFilter === "skipped" && ua >= 0) return;
      var L = letters(q.num);
      out += "<div class=\"card review\"><div class=\"rv-head\"><span class=\"qnum\">" + q.num + ".</span><div class=\"rv-tags\">" +
        "<span class=\"tag " + (ua < 0 ? "skip" : ok ? "ok" : "no") + "\">" + (ua < 0 ? "UNANSWERED" : ok ? "CORRECT" : "INCORRECT") + "</span>" +
        "<span class=\"tag topic\">" + TOPIC_NAMES[q.topic].toUpperCase() + "</span>" + (S.flags[i] ? "<span class=\"tag flag\">FLAGGED</span>" : "") + "</div></div>" +
        "<div class=\"qbody\">" + q.html + "</div><div class=\"opts rv-opts\">" +
        q.choices.map(function (c, ci) {
          var cls = ci === q.answer ? " right" : (ci === ua ? " wrong" : "");
          return "<div class=\"opt-btn" + cls + "\"><span class=\"let\">" + L[ci] + "</span><span>" + c + "</span>" + (ci === ua ? "<span style=\"margin-left:auto;font-size:0.76rem;font-weight:700\">Your answer</span>" : (ci === q.answer ? "<span style=\"margin-left:auto;font-size:0.76rem;font-weight:700\">Correct</span>" : "")) + "</div>";
        }).join("") + "</div><div class=\"expl\"><b>Solution</b>" + q.expl + "</div></div>";
    });
    list.innerHTML = out || "<div class=\"card\"><p style=\"margin:0\">Nothing in this category.</p></div>";
  }

  document.addEventListener("keydown", function (e) {
    if (!S || S.done || !document.getElementById("prevBtn")) return;
    if (e.key === "ArrowLeft") go(S.idx - 1);
    else if (e.key === "ArrowRight") go(S.idx + 1);
  });

  window.__ACT = { get state() { return S; }, start: startExam, submit: submit, GENS: GENS, SLOTS: SLOTS };
  renderStart();
})();
</script>
</body>
</html>
