<div class="wrap">
  <header>
    <div class="eyebrow">Calc 1 &middot; Limits &amp; Continuity</div>
    <h1>Limits Practice Test</h1>
    <p>Every part regenerates its own random version — work it out on paper, type your answer, and check yourself. Click "New version" on any part as many times as you want to drill it again with different numbers.</p>
  </header>

  <div class="toolbar">
    <div class="score-box">
      <span class="score-num" id="scoreNum">0 / 0</span>
      <span class="score-label">points checked correct</span>
    </div>
    <button class="icon-btn" id="newTestBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      New full test
    </button>
  </div>

  <div id="groups"></div>
</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // Utilities
  // ============================================================
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randNonZeroInt(min, max) { var v; do { v = randInt(min, max); } while (v === 0); return v; }
  function randIntExcluding(exclude, min, max) {
    var v, tries = 0;
    do { v = randInt(min, max); tries++; } while (exclude.indexOf(v) !== -1 && tries < 200);
    return v;
  }
  function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function randBool() { return Math.random() < 0.5; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function fmtNum(n) { return n.toLocaleString("en-US"); }
  function gcdInt(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
  function fracLabel(p, q) {
    var g = gcdInt(p, q);
    p = p / g; q = q / g;
    if (q < 0) { p = -p; q = -q; }
    return { p: p, q: q };
  }

  // build a descending-degree polynomial display string from a leading coef + array of lower coefs (index 0 = degree-1 term, ..., last = constant)
  var SUP = { 4: "&#8308;", 3: "&sup3;", 2: "&sup2;", 1: "", 0: "" };
  function polyStr(leadCoef, leadDeg, lowerCoefs, constantDisplay) {
    // lowerCoefs: array length leadDeg, coefs for degree (leadDeg-1) down to degree 1; constantDisplay: string or number or null
    var parts = [];
    function pushTerm(coef, deg) {
      if (!coef) return;
      var abs = Math.abs(coef);
      var label = deg === 0 ? "" : ("x" + (SUP[deg] || ("&#8319;" /*fallback*/)));
      var coefStr = (abs === 1 && deg !== 0) ? "" : fmtNum(abs);
      parts.push({ neg: coef < 0, text: coefStr + label });
    }
    pushTerm(leadCoef, leadDeg);
    for (var d = leadDeg - 1; d >= 1; d--) {
      var c = lowerCoefs[leadDeg - 1 - d];
      pushTerm(c, d);
    }
    if (constantDisplay !== null && constantDisplay !== undefined && constantDisplay !== 0) {
      if (typeof constantDisplay === "string") {
        parts.push({ neg: false, text: constantDisplay });
      } else {
        pushTerm(constantDisplay, 0);
      }
    }
    if (!parts.length) return "0";
    var out = "";
    parts.forEach(function (t, i) {
      if (i === 0) out += (t.neg ? "&minus;" : "") + t.text;
      else out += (t.neg ? " &minus; " : " + ") + t.text;
    });
    return out;
  }

  function frac(numHtml, denHtml) {
    return "<span class=\"frac\"><span class=\"num\">" + numHtml + "</span><span class=\"den\">" + denHtml + "</span></span>";
  }
  function radical(innerHtml, index) {
    var idx = index ? "<span class=\"idx\">" + index + "</span>" : "";
    return "<span class=\"radical\">" + idx + "<span class=\"rsym\">&radic;</span><span class=\"rad-inner\">" + innerHtml + "</span></span>";
  }
  function signedTerm(coef, label) {
    if (coef === 0) return "";
    var abs = Math.abs(coef);
    var coefStr = (abs === 1 && label) ? "" : String(abs);
    return (coef < 0 ? "&minus;" : "+") + " " + coefStr + label;
  }

  // ---- answer parsing / checking ----
  function parseAnswer(raw) {
    if (raw === null || raw === undefined) return { type: "invalid" };
    var str = String(raw).trim().toLowerCase();
    if (str === "") return { type: "invalid" };
    if (["dne", "does not exist", "no limit", "undefined", "not defined"].indexOf(str) !== -1) return { type: "dne" };
    if (["inf", "infinity", "+inf", "+infinity", "∞", "+∞"].indexOf(str) !== -1) return { type: "inf", sign: 1 };
    if (["-inf", "-infinity", "-∞"].indexOf(str) !== -1) return { type: "inf", sign: -1 };
    var fracMatch = str.match(/^(-?\d+(\.\d+)?)\s*\/\s*(-?\d+(\.\d+)?)$/);
    if (fracMatch) {
      var p = parseFloat(fracMatch[1]), q = parseFloat(fracMatch[3]);
      if (q !== 0) return { type: "number", value: p / q };
    }
    var cleaned = str.replace(/,/g, "");
    if (/^-?\d*\.?\d+$/.test(cleaned)) return { type: "number", value: parseFloat(cleaned) };
    return { type: "invalid" };
  }
  function answersMatch(user, correct, tol) {
    tol = tol === undefined ? 0.01 : tol;
    if (user.type === "invalid") return false;
    if (correct.type === "dne") return user.type === "dne";
    if (correct.type === "inf") return user.type === "inf" && user.sign === correct.sign;
    if (correct.type === "number") return user.type === "number" && Math.abs(user.value - correct.value) < tol;
    return false;
  }
  function fmtAnswer(a) {
    if (a.type === "dne") return "DNE";
    if (a.type === "inf") return a.sign > 0 ? "+&infin;" : "&minus;&infin;";
    if (a.type === "number") {
      var v = a.value;
      var rounded = Math.round(v * 1000) / 1000;
      return String(rounded);
    }
    return "?";
  }

  // ============================================================
  // Canvas graph helper
  // ============================================================
  function setupCanvas(canvas) {
    var cssW = canvas.clientWidth || 300, cssH = canvas.clientHeight || 200;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    return { ctx: ctx, w: cssW, h: cssH };
  }
  function makeMapper(cssW, cssH, xMin, xMax, yMin, yMax, pad) {
    pad = pad || 24;
    var w = cssW - pad * 1.4, h = cssH - pad * 1.6;
    var sx = w / (xMax - xMin), sy = h / (yMax - yMin);
    var ox = pad, oy = cssH - pad * 0.9;
    return function (x, y) { return [ox + (x - xMin) * sx, oy - (y - yMin) * sy]; };
  }
  function drawGrid(canvas, xMin, xMax, yMin, yMax) {
    var setup = setupCanvas(canvas), ctx = setup.ctx, cssW = setup.w, cssH = setup.h;
    var toPx = makeMapper(cssW, cssH, xMin, xMax, yMin, yMax);
    var styles = getComputedStyle(document.documentElement);
    var gridColor = styles.getPropertyValue("--graph-grid").trim();
    var axisColor = styles.getPropertyValue("--graph-axis").trim();
    var labelColor = styles.getPropertyValue("--ink-soft").trim();
    ctx.lineWidth = 1;
    ctx.strokeStyle = gridColor;
    ctx.beginPath();
    for (var gx = Math.ceil(xMin); gx <= Math.floor(xMax); gx++) {
      var p0 = toPx(gx, yMin), p1 = toPx(gx, yMax);
      ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
    }
    for (var gy = Math.ceil(yMin); gy <= Math.floor(yMax); gy++) {
      var q0 = toPx(xMin, gy), q1 = toPx(xMax, gy);
      ctx.moveTo(q0[0], q0[1]); ctx.lineTo(q1[0], q1[1]);
    }
    ctx.stroke();
    // axes
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = axisColor;
    ctx.beginPath();
    if (xMin <= 0 && xMax >= 0) { var a0 = toPx(0, yMin), a1 = toPx(0, yMax); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]); }
    if (yMin <= 0 && yMax >= 0) { var b0 = toPx(xMin, 0), b1 = toPx(xMax, 0); ctx.moveTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); }
    ctx.stroke();
    // Tick labels along the bottom/left edges of the plot — always visible even
    // when the graph's window doesn't happen to include the origin, so every
    // gridline can be read off directly instead of needing to count from (0,0).
    ctx.fillStyle = labelColor;
    ctx.font = "10px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    var xStep = (xMax - xMin) > 16 ? 2 : 1;
    for (var lx = Math.ceil(xMin / xStep) * xStep; lx <= Math.floor(xMax); lx += xStep) {
      var lp = toPx(lx, yMin);
      ctx.fillText(String(lx), Math.min(Math.max(lp[0], 12), cssW - 12), cssH - 13);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    var yStep = (yMax - yMin) > 16 ? 2 : 1;
    for (var ly = Math.ceil(yMin / yStep) * yStep; ly <= Math.floor(yMax); ly += yStep) {
      var lq = toPx(xMin, ly);
      ctx.fillText(String(ly), 4, Math.min(Math.max(lq[1], 10), cssH - 16));
    }
    return { ctx: ctx, toPx: toPx };
  }
  function drawSegment(ctx, toPx, x0, y0, x1, y1, color, width) {
    ctx.strokeStyle = color; ctx.lineWidth = width || 2.4; ctx.lineCap = "round";
    var p0 = toPx(x0, y0), p1 = toPx(x1, y1);
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
  }
  function drawCircle(ctx, toPx, x, y, color, open) {
    var p = toPx(x, y);
    ctx.beginPath(); ctx.arc(p[0], p[1], 4.3, 0, Math.PI * 2);
    if (open) {
      var styles = getComputedStyle(document.documentElement);
      ctx.fillStyle = styles.getPropertyValue("--card-bg").trim();
      ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
    } else {
      ctx.fillStyle = color; ctx.fill();
    }
  }

  // ============================================================
  // Question part definitions
  // ============================================================
  var PARTS = [];

  // ---------- Group 1: Calculate the limits ----------
  PARTS.push({
    id: "1a", group: "1", label: "(a)", points: 4,
    gen: function () {
      var r1 = randInt(-9, 9);
      var r2 = randIntExcluding([r1], -9, 9);
      var indeterminate = randBool();
      var a = indeterminate ? r2 : randIntExcluding([r1, r2], -9, 9);
      return { r1: r1, r2: r2, a: a, answer: { type: "number", value: a - r1 } };
    },
    prompt: function (s) {
      var numer = "x&sup2; " + signedTerm(-(s.r1 + s.r2), "x") + " " + signedTerm(s.r1 * s.r2, "");

      id: id, group: "5", label: label, points: 3, hasGraph: true, graphSmall: true,
      gen: genDiscontinuityGraph,
      prompt: function () { return "What type of discontinuity (if any) does this graph show at x = the marked point?"; },
      drawGraph: function (canvas, s) {
        var xMin = s.c - 4, xMax = s.c + 4, yMin = -5, yMax = 5;
        var g = drawGrid(canvas, xMin, xMax, yMin, yMax);
        var styles = getComputedStyle(document.documentElement);
        var colorA = styles.getPropertyValue("--graph-stroke-a").trim();
        var colorB = styles.getPropertyValue("--graph-stroke-b").trim();
        var axisColor = styles.getPropertyValue("--graph-axis").trim();
        if (s.type === "continuous") {
          drawSegment(g.ctx, g.toPx, xMin, -0.6 * xMin + 1, xMax, -0.6 * xMax + 1, colorA);
        } else if (s.type === "jump") {
          drawSegment(g.ctx, g.toPx, xMin, 0.7 * (xMin - s.c) + 3, s.c, 3, colorA);
          drawSegment(g.ctx, g.toPx, s.c, -1, xMax, 0.7 * (xMax - s.c) - 1, colorB);
          drawCircle(g.ctx, g.toPx, s.c, 3, colorA, true);
          drawCircle(g.ctx, g.toPx, s.c, -1, colorB, false);
        } else if (s.type === "removable") {
          drawSegment(g.ctx, g.toPx, xMin, 0.6 * (xMin - s.c) + 1, xMax, 0.6 * (xMax - s.c) + 1, colorA);
          drawCircle(g.ctx, g.toPx, s.c, 1, colorA, true);
          drawCircle(g.ctx, g.toPx, s.c, 2.6, colorB, false);
        } else {
          // infinite: two branches shooting away from a vertical asymptote at x=c
          g.ctx.setLineDash([4, 4]);
          g.ctx.strokeStyle = axisColor; g.ctx.lineWidth = 1.3;
          var a0 = g.toPx(s.c, yMin), a1 = g.toPx(s.c, yMax);
          g.ctx.beginPath(); g.ctx.moveTo(a0[0], a0[1]); g.ctx.lineTo(a1[0], a1[1]); g.ctx.stroke();
          g.ctx.setLineDash([]);
          var leftPts = [], rightPts = [];
          var i, x;
          for (i = 0; i <= 20; i++) { x = xMin + (s.c - 0.15 - xMin) * (i / 20); leftPts.push([x, Math.min(yMax, 1 / (x - s.c) * -1 + 0)]); }
          for (i = 0; i <= 20; i++) { x = s.c + 0.15 + (xMax - s.c - 0.15) * (i / 20); rightPts.push([x, Math.max(yMin, 1 / (x - s.c) * -1 + 0)]); }
          g.ctx.strokeStyle = colorA; g.ctx.lineWidth = 2.4; g.ctx.beginPath();
          leftPts.forEach(function (pt, idx) { var p = g.toPx(pt[0], Math.max(yMin, Math.min(yMax, pt[1]))); if (idx === 0) g.ctx.moveTo(p[0], p[1]); else g.ctx.lineTo(p[0], p[1]); });
          g.ctx.stroke();
          g.ctx.strokeStyle = colorB; g.ctx.beginPath();
          rightPts.forEach(function (pt, idx) { var p = g.toPx(pt[0], Math.max(yMin, Math.min(yMax, pt[1]))); if (idx === 0) g.ctx.moveTo(p[0], p[1]); else g.ctx.lineTo(p[0], p[1]); });
          g.ctx.stroke();
        }
      },
      inputsHtml: function () {
        var opts = [["jump", "Jump"], ["removable", "Removable"], ["infinite", "Infinite / unbounded"], ["continuous", "Continuous (no discontinuity)"]];
        return "<div class=\"mc-row\">" + opts.map(function (o) {
          return "<button type=\"button\" class=\"mc-opt\" data-val=\"" + o[0] + "\">" + o[1] + "</button>";
        }).join("") + "</div>";
      },
      afterRender: function (card) {
        var opts = card.querySelectorAll(".mc-opt");
        opts.forEach(function (btn) {
          btn.addEventListener("click", function () {
            opts.forEach(function (b) { b.classList.remove("selected"); });
            btn.classList.add("selected");
          });
        });
      },
      readAnswer: function (card) {
        var sel = card.querySelector(".mc-opt.selected");
        return { type: sel ? sel.getAttribute("data-val") : null };
      },
      isCorrect: function (ua, s) { return ua.type === s.type; },
      solutionHtml: function (s) {
        var names = { jump: "Jump discontinuity", removable: "Removable discontinuity", infinite: "Infinite/unbounded discontinuity", continuous: "Continuous &mdash; no discontinuity" };
        var explain = {
          jump: "The two sides approach different y-values as they reach the marked x &mdash; the graph 'jumps'.",
          removable: "The graph approaches a single y-value from both sides, but that point is missing (open circle) or misplaced &mdash; you could 'fix' it by filling in one point.",
          infinite: "The graph shoots off toward &plusmn;&infin; near a vertical asymptote &mdash; it's unbounded near that x-value.",
          continuous: "Both sides approach the same y-value and the function is defined there &mdash; no break at all."
        };
        return "<span class=\"sol-label\">Solution</span>" +
          "<div class=\"step\">" + explain[s.type] + "</div>" +
          "<div class=\"final\">Answer: " + names[s.type] + "</div>";
      }
    };
  }
  PARTS.push(makeIdentifyPart("5a", "(a)"));
  PARTS.push(makeIdentifyPart("5b", "(b)"));
  PARTS.push(makeIdentifyPart("5c", "(c)"));

  // ---------- Group 6: definition of continuity (fill in the blanks) ----------
  PARTS.push({
    id: "6", group: "6", label: "", points: 4,
    gen: function () {
      var blank1 = shuffle([
        { t: "f(c) is defined", correct: true },
        { t: "f(c) is undefined", correct: false },
        { t: "f(c) equals zero", correct: false }
      ]);
      var blank2 = shuffle([
        { t: "lim x&rarr;c f(x) exists", correct: true },
        { t: "lim x&rarr;c f(x) is infinite", correct: false },
        { t: "lim x&rarr;c f(x) equals zero", correct: false }
      ]);
      var blank3 = shuffle([
        { t: "lim x&rarr;c f(x) = f(c)", correct: true },
        { t: "lim x&rarr;c f(x) &ne; f(c)", correct: false },
        { t: "f(x) = f(c) for all x", correct: false }
      ]);
      return { blank1: blank1, blank2: blank2, blank3: blank3 };
    },
    prompt: function () {
      return "Fill in the definition: a function f is continuous at x = c if all of the following hold:";
    },
    inputsHtml: function (s) {
      function opts(arr, cls) {
        return "<select class=\"" + cls + "\"><option value=\"\">choose...</option>" +
          arr.map(function (o, i) { return "<option value=\"" + i + "\">" + o.t + "</option>"; }).join("") + "</select>";
      }
      return "<div class=\"subrow\"><span class=\"field-label\">1.</span>" + opts(s.blank1, "ans-b1") + "</div>" +
        "<div class=\"subrow\"><span class=\"field-label\">2.</span>" + opts(s.blank2, "ans-b2") + "</div>" +
        "<div class=\"subrow\"><span class=\"field-label\">3.</span>" + opts(s.blank3, "ans-b3") + "</div>";
    },
    readAnswer: function (card) {
      return {
        b1: card.querySelector(".ans-b1").value,
        b2: card.querySelector(".ans-b2").value,
        b3: card.querySelector(".ans-b3").value
      };
    },
    isCorrect: function (ua, s) {
      function ok(sel, arr) { return sel !== "" && arr[parseInt(sel, 10)] && arr[parseInt(sel, 10)].correct; }
      return ok(ua.b1, s.blank1) && ok(ua.b2, s.blank2) && ok(ua.b3, s.blank3);
    },
    solutionHtml: function () {
      return "<span class=\"sol-label\">Solution</span>" +
        "<div class=\"step\">A function f is continuous at x = c if:</div>" +
        "<div class=\"step\">1. f(c) is defined</div>" +
        "<div class=\"step\">2. lim x&rarr;c f(x) exists</div>" +
        "<div class=\"step\">3. lim x&rarr;c f(x) = f(c)</div>" +
        "<div class=\"final\">All three conditions must hold.</div>";
    }
  });

  // ---------- Group 7: IVT reasoning ----------
  PARTS.push({
    id: "7", group: "7", label: "", points: 4,
    gen: function () {
      var a = randInt(-6, 2);
      var b = randInt(a + 3, 8);
      var v1 = randInt(-10, 10);
      var v2 = randIntExcluding([v1], -10, 10);
      var lo = Math.min(v1, v2), hi = Math.max(v1, v2);
      var variant = Math.random() < 0.35 ? "boundsMismatch" : "normal";
      var p, q, v0, answer;
      if (variant === "boundsMismatch") {
        var maxNarrow = Math.floor((b - a - 1) / 2);
        var narrowLeft = randInt(0, maxNarrow);
        var narrowRight = randInt(0, maxNarrow);
        if (narrowLeft === 0 && narrowRight === 0) narrowLeft = 1;
        p = a + narrowLeft;
        q = b - narrowRight;
        v0 = randInt(lo, hi);
        answer = { type: "bool", value: false };
      } else {
        p = a; q = b;
        v0 = randInt(lo - 5, hi + 5);
        answer = { type: "bool", value: v0 >= lo && v0 <= hi };
      }
      return { a: a, b: b, p: p, q: q, v1: v1, v2: v2, v0: v0, lo: lo, hi: hi, variant: variant, answer: answer };
    },
    prompt: function (s) {
      return "Given that f(x) is continuous on [" + s.a + ", " + s.b + "] and f(" + s.a + ") = " + s.v1 + " and f(" + s.b + ") = " + s.v2 +
        ", can you conclude that f(c) = " + s.v0 + " for some c &isin; [" + s.p + ", " + s.q + "]?";
    },
    inputsHtml: function () {
      return "<div class=\"mc-row\"><button type=\"button\" class=\"mc-opt\" data-val=\"yes\">Yes</button><button type=\"button\" class=\"mc-opt\" data-val=\"no\">No</button></div>";
    },
    afterRender: function (card) {
      var opts = card.querySelectorAll(".mc-opt");
      opts.forEach(function (btn) {
        btn.addEventListener("click", function () {
          opts.forEach(function (b) { b.classList.remove("selected"); });
          btn.classList.add("selected");
        });
      });
    },
    readAnswer: function (card) {
      var sel = card.querySelector(".mc-opt.selected");
      return { val: sel ? sel.getAttribute("data-val") : null };
    },
    isCorrect: function (ua, s) {
      if (!ua.val) return false;
      var userYes = ua.val === "yes";
      return userYes === s.answer.value;
    },
    solutionHtml: function (s) {
      if (s.variant === "boundsMismatch") {
        var missingBits = [];
        if (s.p !== s.a) missingBits.push("f(" + s.p + ")");
        if (s.q !== s.b) missingBits.push("f(" + s.q + ")");
        var missingStr = missingBits.join(" and ");
        return "<span class=\"sol-label\">Solution</span>" +
          "<div class=\"step\">IVT needs the function's values at the endpoints of the <em>specific interval</em> you're concluding over &mdash; here that's " + missingStr + ".</div>" +
          "<div class=\"step\">We're only given f(" + s.a + ")=" + s.v1 + " and f(" + s.b + ")=" + s.v2 + ", the endpoints of [" + s.a + ", " + s.b + "] &mdash; a wider interval than [" + s.p + ", " + s.q + "].</div>" +
          "<div class=\"step\">Even though " + s.v0 + " sits between " + s.v1 + " and " + s.v2 + ", that says nothing about what f does specifically on [" + s.p + ", " + s.q + "] without knowing " + missingStr + ". Continuity on the bigger interval doesn't hand you the values you'd need at " + (missingBits.length > 1 ? "those points" : "that point") + ".</div>" +
          "<div class=\"final\">Answer: No &mdash; the known values are at the endpoints of [" + s.a + ", " + s.b + "], not [" + s.p + ", " + s.q + "].</div>";
      }
      if (s.answer.value) {
        return "<span class=\"sol-label\">Solution</span>" +
          "<div class=\"step\">f is continuous on [" + s.a + ", " + s.b + "], and " + s.v0 + " lies between f(" + s.a + ")=" + s.v1 + " and f(" + s.b + ")=" + s.v2 + ".</div>" +
          "<div class=\"step\">By the Intermediate Value Theorem, f must take every value between " + s.v1 + " and " + s.v2 + " at least once on that interval.</div>" +
          "<div class=\"final\">Answer: Yes.</div>";
      }
      return "<span class=\"sol-label\">Solution</span>" +
        "<div class=\"step\">f(" + s.a + ")=" + s.v1 + " and f(" + s.b + ")=" + s.v2 + ", so IVT only guarantees f hits every value between " + s.lo + " and " + s.hi + ".</div>" +
        "<div class=\"step\">" + s.v0 + " falls outside that range, so IVT gives no guarantee here (f might still happen to equal " + s.v0 + " somewhere, but we cannot conclude it).</div>" +
        "<div class=\"final\">Answer: No, not guaranteed.</div>";
    }
  });

  // ============================================================
  // Group metadata
  // ============================================================
  var GROUP_META = {
    "1": { num: "1.", desc: "Calculate the following limits / one-sided limits." },
    "2": { num: "2.", desc: "Where are the following functions discontinuous? State why." },
    "3": { num: "3.", desc: "Find the limit." },
    "4": { num: "4.", desc: "Find the limit." },
    "5": { num: "5.", desc: "Identify the type of discontinuity (if any) shown in each graph." },
    "6": { num: "6.", desc: "Give the definition of continuity at a point." },
    "7": { num: "7.", desc: "Reason about the Intermediate Value Theorem." }
  };

  // ============================================================
  // Engine: mount cards
  // ============================================================
  var scoreMap = {};
  var TOTAL_POINTS = PARTS.reduce(function (sum, p) { return sum + p.points; }, 0);
  var scoreNumEl = document.getElementById("scoreNum");

  function updateScore() {
    var earned = 0;
    Object.keys(scoreMap).forEach(function (k) { earned += scoreMap[k]; });
    scoreNumEl.textContent = earned + " / " + TOTAL_POINTS;
  }

  window.__PT_STATE = {};

  function mountCard(part, container) {
    var card = document.createElement("div");
    card.className = "qcard";
    card.setAttribute("data-id", part.id);

    var headHtml = "<div class=\"qcard-head\"><div class=\"qtitle\">" +
      (part.label ? "<span class=\"qlabel\">" + part.label + "</span>" : "") +
      "<span class=\"qpoints\">" + part.points + " pt" + (part.points === 1 ? "" : "s") + "</span></div>" +
      "<button class=\"icon-btn new-version-btn\" type=\"button\">" +
      "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3h5v5\"/><path d=\"M4 20 21 3\"/><path d=\"M21 16v5h-5\"/><path d=\"M15 15l6 6\"/><path d=\"M4 4l5 5\"/></svg>" +
      "New version</button></div>";

    card.innerHTML = headHtml +
      "<div class=\"qprompt\"></div>" +
      (part.hasGraph ? "<div class=\"qgraph-wrap" + (part.graphSmall ? " small" : "") + "\"><canvas></canvas></div>" : "") +
      "<div class=\"qinputs\"></div>" +
      "<div class=\"qactions\"><button class=\"btn-primary check-btn\" type=\"button\">Check Answer</button><button class=\"btn-secondary solution-btn\" type=\"button\">Show Solution</button></div>" +
      "<div class=\"qfeedback hidden\"></div>" +
      "<div class=\"qsolution hidden\"></div>";

    container.appendChild(card);

    var promptEl = card.querySelector(".qprompt");
    var inputsEl = card.querySelector(".qinputs");
    var feedbackEl = card.querySelector(".qfeedback");
    var solutionEl = card.querySelector(".qsolution");
    var canvasEl = part.hasGraph ? card.querySelector("canvas") : null;

    var state;

    function render() {
      state = part.gen();
      window.__PT_STATE[part.id] = state;
      promptEl.innerHTML = part.prompt(state);
      inputsEl.innerHTML = part.inputsHtml(state, part.id);
      feedbackEl.classList.add("hidden");
      feedbackEl.innerHTML = "";
      solutionEl.classList.add("hidden");
      solutionEl.innerHTML = "";
      scoreMap[part.id] = 0;
      updateScore();
      if (part.afterRender) part.afterRender(card);
      if (part.hasGraph) part.drawGraph(canvasEl, state);
    }

    card.querySelector(".new-version-btn").addEventListener("click", render);
    card.querySelector(".check-btn").addEventListener("click", function () {
      var ua = part.readAnswer(card);
      var correct = part.isCorrect(ua, state);
      feedbackEl.classList.remove("hidden");
      if (correct) {
        feedbackEl.className = "qfeedback good";
        feedbackEl.innerHTML = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg> Correct!";
        scoreMap[part.id] = part.points;
      } else {
        feedbackEl.className = "qfeedback bad";
        feedbackEl.innerHTML = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M15 9l-6 6M9 9l6 6\"/></svg> Not quite — check the solution below.";
        scoreMap[part.id] = 0;
      }
      updateScore();
    });
    card.querySelector(".solution-btn").addEventListener("click", function () {
      solutionEl.innerHTML = part.solutionHtml(state);
      solutionEl.classList.remove("hidden");
    });

    if (part.hasGraph) {
      window.addEventListener("resize", function () { if (state) part.drawGraph(canvasEl, state); });
    }

    render();
  }

  function buildAll() {
    var groupsEl = document.getElementById("groups");
    groupsEl.innerHTML = "";
    scoreMap = {};
    var seenGroups = {};
    var currentContainer = null;
    PARTS.forEach(function (part) {
      if (!seenGroups[part.group]) {
        seenGroups[part.group] = true;
        var meta = GROUP_META[part.group];
        var gh = document.createElement("div");
        gh.className = "group-head";
        gh.innerHTML = "<div class=\"gnum\">" + meta.num + "</div><div class=\"gdesc\">" + meta.desc + "</div>";
        groupsEl.appendChild(gh);
        currentContainer = document.createElement("div");
        groupsEl.appendChild(currentContainer);
      }
      mountCard(part, currentContainer);
    });
    updateScore();
  }

  document.getElementById("newTestBtn").addEventListener("click", buildAll);

  buildAll();
})();
</script>
