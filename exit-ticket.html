<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exit Ticket — Cardinal Ritter Prep Math</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f4f4;color:#111111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
header{background:#6b1a26;border-bottom:1px solid rgba(255,255,255,.15);padding:1.1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.back{color:rgba(255,255,255,.85);text-decoration:none;font-size:.85rem}.back:hover{color:#fff}
header h1{font-size:1.2rem;font-weight:700;flex:1;color:#fff}
.date-badge{font-size:.78rem;color:rgba(255,255,255,.75);margin-left:auto}

.section-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#555555;padding:.75rem 1.5rem .25rem;max-width:980px;margin:0 auto}
.section-label.first{margin-top:1.25rem}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;max-width:980px;margin:.25rem auto 0;padding:0 1.5rem}
@media(max-width:680px){.grid{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem 1.4rem;display:flex;flex-direction:column;gap:.75rem}
.card.ca{border-color:#2e533944}
.card.c1{border-color:#6b1a2644}
.card.c2{border-color:#1e3a5c44}
.card.pc{border-color:#7a3b8a44}
.card-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card.ca .card-label{color:#2e5339}
.card.c1 .card-label{color:#6b1a26}
.card.c2 .card-label{color:#1e3a5c}
.card.pc .card-label{color:#7a3b8a}
.section-info{font-size:.8rem;color:#555555}

.q-box{background:#f4f4f4;border:1px solid #e0e0e0;border-radius:8px;padding:1rem 1.1rem;font-size:.975rem;line-height:1.75;min-height:3.5rem}
.q-box .katex-display{margin:.4rem 0}

.ans-box{background:#f5f3ef;border:1px solid #e0e0e0;border-radius:8px;padding:.85rem 1.1rem;font-size:.9rem;line-height:1.75;display:none}
.ans-box.visible{display:block}
.ans-box .katex-display{margin:.35rem 0}
.ans-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555555;margin-bottom:.35rem}

.reveal-btn{align-self:flex-start;padding:.35rem .95rem;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;background:transparent;margin-top:-.1rem}
.card.ca .reveal-btn{color:#2e5339;border-color:#2e5339}
.card.ca .reveal-btn:hover{background:#eaf0ec}
.card.c1 .reveal-btn{color:#6b1a26;border-color:#6b1a26}
.card.c1 .reveal-btn:hover{background:#f5e9ea}
.card.c2 .reveal-btn{color:#1e3a5c;border-color:#1e3a5c}
.card.c2 .reveal-btn:hover{background:#e8edf4}
.card.pc .reveal-btn{color:#7a3b8a;border-color:#7a3b8a}
.card.pc .reveal-btn:hover{background:#f5eafa}
.reveal-btn:disabled{opacity:.4;cursor:default}

.divider{max-width:980px;margin:1.25rem auto 0;padding:0 1.5rem}
.divider hr{border:none;border-top:1px solid #e0e0e0}

.none-msg{font-size:.85rem;color:#555555;font-style:italic}
.loading{font-size:.85rem;color:#555555;font-style:italic}
.page-bottom{padding-bottom:3rem}
</style>
</head>
<body>
<header>
  <a href="./index.html" class="back">← Portal</a>
  <h1>📝 Exit Ticket</h1>
  <span class="date-badge" id="dateBadge"></span>
</header>

<!-- TODAY'S EXIT TICKET -->
<div class="section-label first">📝 Today's Exit Ticket</div>
<div class="grid">
  <div class="card ca">
    <div class="card-label">College Algebra</div>
    <div class="section-info loading" id="caTodaySection">Loading…</div>
    <div class="q-box" id="caTodayQ"><span class="loading">Loading…</span></div>
    <div class="ans-box" id="caTodayAns"></div>
  </div>
  <div class="card c1">
    <div class="card-label">Calc 1</div>
    <div class="section-info loading" id="c1TodaySection">Loading…</div>
    <div class="q-box" id="c1TodayQ"><span class="loading">Loading…</span></div>
    <div class="ans-box" id="c1TodayAns"></div>
  </div>
  <div class="card c2">
    <div class="card-label">Calc 2</div>
    <div class="section-info loading" id="c2TodaySection">Loading…</div>
    <div class="q-box" id="c2TodayQ"><span class="loading">Loading…</span></div>
    <div class="ans-box" id="c2TodayAns"></div>
  </div>
  <div class="card pc">
    <div class="card-label">PreCalc</div>
    <div class="section-info loading" id="pcTodaySection">Loading…</div>
    <div class="q-box" id="pcTodayQ"><span class="loading">Loading…</span></div>
    <div class="ans-box" id="pcTodayAns"></div>
  </div>
</div>

<div class="divider"><hr></div>

<!-- LAST CLASS ANSWER -->
<div class="section-label">↩ Last Class — Answer</div>
<div class="grid page-bottom">
  <div class="card ca">
    <div class="card-label">College Algebra</div>
    <div class="section-info loading" id="caLastSection">Loading…</div>
    <div class="q-box" id="caLastQ"><span class="loading">Loading…</span></div>
    <div class="ans-box visible" id="caLastAns"></div>
  </div>
  <div class="card c1">
    <div class="card-label">Calc 1</div>
    <div class="section-info loading" id="c1LastSection">Loading…</div>
    <div class="q-box" id="c1LastQ"><span class="loading">Loading…</span></div>
    <div class="ans-box visible" id="c1LastAns"></div>
  </div>
  <div class="card c2">
    <div class="card-label">Calc 2</div>
    <div class="section-info loading" id="c2LastSection">Loading…</div>
    <div class="q-box" id="c2LastQ"><span class="loading">Loading…</span></div>
    <div class="ans-box visible" id="c2LastAns"></div>
  </div>
  <div class="card pc">
    <div class="card-label">PreCalc</div>
    <div class="section-info loading" id="pcLastSection">Loading…</div>
    <div class="q-box" id="pcLastQ"><span class="loading">Loading…</span></div>
    <div class="ans-box visible" id="pcLastAns"></div>
  </div>
</div>

<script>
function renderMath(text) {
  if (!text) return '';
  text = text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
             .replace(/&ldquo;/g,'"').replace(/&rdquo;/g,'"').replace(/&mdash;/g,'—');
  const parts = text.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]*?\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))/g);
  return parts.map(p => {
    let display=false, tex=null;
    if (p.startsWith('$$')&&p.endsWith('$$'))        {display=true; tex=p.slice(2,-2);}
    else if(p.startsWith('$')&&p.endsWith('$'))      {display=false;tex=p.slice(1,-1);}
    else if(p.startsWith('\\[')&&p.endsWith('\\]'))  {display=true; tex=p.slice(2,-2);}
    else if(p.startsWith('\\(')&&p.endsWith('\\)'))  {display=false;tex=p.slice(2,-2);}
    if(tex!==null){
      tex=tex.replace(/\\displaystyle\b/g,'').trim();
      try{return katex.renderToString(tex,{displayMode:display,throwOnError:false});}
      catch(e){return p;}
    }
    return p;
  }).join('');
}

function reveal(id) {
  document.getElementById(id+'Ans').classList.add('visible');
  const btn=document.getElementById(id+'Reveal');
  btn.textContent='Answer shown'; btn.disabled=true;
}

// --- Randomized exit ticket generators (mirrors the do-now GEN pattern) ---
function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

const EXIT_GEN = {};

// Calc_1_1 — Limits: factor-and-cancel, based on notes Example 4
EXIT_GEN['Calc_1_1'] = function() {
  const a = ri(2, 9);
  return {
    q: `Find $\\displaystyle\\lim_{x \\to ${a}}\\dfrac{x^2 - ${a * a}}{x - ${a}}$.`,
    a: `Factor: $\\dfrac{(x-${a})(x+${a})}{x-${a}} = x+${a}$ for $x \\neq ${a}$, so the limit is $${a}+${a}=${2 * a}$.`
  };
};

// Calc_1_1_5 — One-Sided Limits: graph-reading jump discontinuity
EXIT_GEN['Calc_1_1_5'] = function() {
  const a = ri(-4, 4);
  const agree = Math.random() < 0.35;
  const L1 = ri(-6, 8);
  let L2 = L1;
  if (!agree) { do { L2 = ri(-6, 8); } while (L2 === L1); }
  return {
    q: `A graph has a jump at $x=${a}$: an open circle at $(${a}, ${L1})$ is approached from the left, and an open circle at $(${a}, ${L2})$ is approached from the right. Find the left-hand limit, the right-hand limit, and state whether the two-sided limit exists.`,
    a: agree
      ? `Left limit $=${L1}$, right limit $=${L2}$ — they agree, so $\\lim_{x\\to ${a}}f(x) = ${L1}$.`
      : `Left limit $=${L1}$, right limit $=${L2}$ — they disagree, so $\\lim_{x\\to ${a}}f(x)$ is DNE.`
  };
};

// PC_1_1 — Functions: ordered-pair set, evaluate f at a random point, based on notes Example/Practice 1
EXIT_GEN['PC_1_1'] = function() {
  const xs = [1, 2, 3, 4];
  const ys = xs.map(() => ri(-6, 9));
  const pairs = xs.map((x, i) => `(${x},${ys[i]})`).join(',');
  const idx = ri(0, 3);
  const evalX = xs[idx], evalY = ys[idx];
  return {
    q: `Given the set of ordered pairs $\\{${pairs}\\}$, is this a function? Evaluate $f(${evalX})$.`,
    a: `Yes — every input (${xs.join(', ')}) is distinct, so each has exactly one output; it's a function. $f(${evalX}) = ${evalY}$.`
  };
};

document.getElementById('dateBadge').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

Promise.all([
  fetch('./state.json').then(r=>r.json()),
  fetch('./sections.json').then(r=>r.json())
]).then(([state, sections]) => {
  const secMap = {};
  for (const arr of Object.values(sections)) { if (!Array.isArray(arr)) continue; for (const s of arr) secMap[s.id]=s; }

  function fill(secId, prefix, showAnswerNow) {
    const secEl  = document.getElementById(prefix+'Section');
    const qEl    = document.getElementById(prefix+'Q');
    const ansEl  = document.getElementById(prefix+'Ans');
    const revBtn = document.getElementById(prefix+'Reveal');

    if (!secId) {
      secEl.textContent='—';
      qEl.innerHTML='<span class="none-msg">No section data.</span>';
      return;
    }
    const sec = secMap[secId];
    if (!sec) {
      secEl.textContent=secId;
      qEl.innerHTML='<span class="none-msg">Section not found.</span>';
      return;
    }
    secEl.textContent='§'+sec.section+' — '+sec.title;
    secEl.classList.remove('loading');

    // Prefer a randomized generator (same pattern as the do-nows) when one exists for this section.
    const gen = EXIT_GEN[secId] ? EXIT_GEN[secId]() : null;
    const qText = gen ? gen.q : sec.exitTicket;
    const aText = gen ? gen.a : sec.exitTicketAnswer;

    if (qText) {
      qEl.innerHTML = renderMath(qText);
      const ansHtml = '<div class="ans-label">Answer</div>' +
        (aText ? renderMath(aText)
              : '<span class="none-msg">No answer key.</span>');
      ansEl.innerHTML = ansHtml;
      if (showAnswerNow) {
        ansEl.classList.add('visible');
      }
    } else {
      qEl.innerHTML = '<span class="none-msg">No exit ticket for this section.</span>';
    }
  }

  function lastSection(courseObj) {
    const completed = (courseObj?.completedSections||[]);
    const current   = courseObj?.currentSection;
    // Exclude current section in case it was inadvertently added to completedSections
    return completed.filter(id => id !== current).slice(-1)[0] || null;
  }

  // College Algebra
  const caId   = state?.courses?.collegeAlgebra?.currentSection;
  const caLast = lastSection(state?.courses?.collegeAlgebra);
  fill(caId,   'caToday', false);
  fill(caLast, 'caLast',  true);

  // Calculus 1
  const c1Id   = state?.courses?.calc1?.currentSection;
  const c1Last = lastSection(state?.courses?.calc1);
  fill(c1Id,   'c1Today', false);
  fill(c1Last, 'c1Last',  true);

  // Calculus 2
  const c2Id   = state?.courses?.calc2?.currentSection;
  const c2Last = lastSection(state?.courses?.calc2);
  fill(c2Id,   'c2Today', false);
  fill(c2Last, 'c2Last',  true);

  // PreCalc
  const pcId   = state?.courses?.preCalc?.currentSection;
  const pcLast = lastSection(state?.courses?.preCalc);
  fill(pcId,   'pcToday', false);
  fill(pcLast, 'pcLast',  true);

}).catch(err => console.error('exit-ticket boot error:', err));
</script>
</body>
</html>
